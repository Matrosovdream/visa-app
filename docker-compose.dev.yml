name: visa-app-dev

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: visa-app/php:dev
    container_name: visa-app-php
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
    environment:
      PHP_IDE_CONFIG: serverName=visa-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [appnet]

  nginx:
    image: nginx:1.27-alpine
    container_name: visa-app-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [app]
    networks: [appnet]

  vite:
    image: node:20-alpine
    container_name: visa-app-vite
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./:/var/www/html
    networks: [appnet]

  queue-worker:
    image: visa-app/php:dev
    container_name: visa-app-queue
    restart: unless-stopped
    command: ["supervisord", "-c", "/etc/supervisor/conf.d/queue-worker.conf"]
    user: root
    volumes:
      - ./:/var/www/html
      - ./docker/supervisor/queue-worker.conf:/etc/supervisor/conf.d/queue-worker.conf:ro
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    networks: [appnet]

  scheduler:
    image: visa-app/php:dev
    container_name: visa-app-scheduler
    restart: unless-stopped
    command: ["supervisord", "-c", "/etc/supervisor/conf.d/scheduler.conf"]
    user: root
    volumes:
      - ./:/var/www/html
      - ./docker/supervisor/scheduler.conf:/etc/supervisor/conf.d/scheduler.conf:ro
    depends_on:
      app:
        condition: service_started
    networks: [appnet]

  postgres:
    image: postgres:16-alpine
    container_name: visa-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-visa_app}
      POSTGRES_USER: ${DB_USERNAME:-visa}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT_HOST:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-visa} -d ${DB_DATABASE:-visa_app}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [appnet]

  redis:
    image: redis:7-alpine
    container_name: visa-app-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT_HOST:-6379}:6379"
    volumes:
      - redis-data:/data
    networks: [appnet]

  adminer:
    image: adminer:4
    container_name: visa-app-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha
    depends_on: [postgres]
    networks: [appnet]

volumes:
  postgres-data:
  redis-data:

networks:
  appnet:
    driver: bridge
