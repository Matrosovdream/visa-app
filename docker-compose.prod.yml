name: visa-app-prod

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    image: visa-app/php:prod
    container_name: visa-app-php
    restart: always
    env_file: .env
    volumes:
      - app-storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [appnet]

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: visa-app/nginx:prod
    container_name: visa-app-nginx
    restart: always
    ports:
      - "80:80"
    depends_on: [app]
    networks: [appnet]

  queue-worker:
    image: visa-app/php:prod
    container_name: visa-app-queue
    restart: always
    env_file: .env
    command: ["supervisord", "-c", "/etc/supervisor/conf.d/queue-worker.conf"]
    user: root
    volumes:
      - app-storage:/var/www/html/storage
      - ./docker/supervisor/queue-worker.conf:/etc/supervisor/conf.d/queue-worker.conf:ro
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    networks: [appnet]

  scheduler:
    image: visa-app/php:prod
    container_name: visa-app-scheduler
    restart: always
    env_file: .env
    command: ["supervisord", "-c", "/etc/supervisor/conf.d/scheduler.conf"]
    user: root
    volumes:
      - app-storage:/var/www/html/storage
      - ./docker/supervisor/scheduler.conf:/etc/supervisor/conf.d/scheduler.conf:ro
    depends_on:
      app:
        condition: service_started
    networks: [appnet]

  postgres:
    image: postgres:16-alpine
    container_name: visa-app-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [appnet]

  redis:
    image: redis:7-alpine
    container_name: visa-app-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data
    networks: [appnet]

  adminer:
    image: adminer:4
    container_name: visa-app-adminer
    restart: always
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on: [postgres]
    networks: [appnet]

volumes:
  postgres-data:
  redis-data:
  app-storage:

networks:
  appnet:
    driver: bridge
